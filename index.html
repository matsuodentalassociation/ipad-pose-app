<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>姿勢解析</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #container { position:relative; width:100vw; height: var(--app-height, 100vh); }
  video, canvas.live { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
  #shutter {
    position:absolute; bottom: calc(24px + env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%);
    width:70px; height:70px; border-radius:50%;
    background:#fff; border:4px solid #ccc; z-index:100;
    touch-action:manipulation;
  }
  #topBar {
    position:absolute; top: calc(10px + env(safe-area-inset-top));
    left:10px; right:10px; z-index:100;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
    font-family:-apple-system, sans-serif; color:#fff;
  }
  #tiltDisplay { background:rgba(0,0,0,0.55); padding:6px 9px; border-radius:8px; font-size:12px; white-space:nowrap; }
  #topBarButtons { display:flex; gap:6px; }
  #switchCameraBtn, #calibrateBtn {
    padding:8px 10px; border:none; border-radius:8px;
    background:#0a84ff; color:#fff; font-size:12px; font-weight:600;
    touch-action:manipulation; white-space:nowrap;
  }
  #calibrateBtn { background:#8e44ad; }
  #switchCameraBtn:disabled, #calibrateBtn:disabled { opacity:0.5; }
  #errorBox {
    position:fixed; top:0; left:0; right:0; z-index:9999;
    background:#c81e1e; color:#fff; padding:10px; font-size:13px;
    display:none; font-family:-apple-system, sans-serif;
  }
  #resultScreen {
    position:fixed; inset:0; background:rgba(0,0,0,0.92);
    z-index:200; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system, sans-serif; color:#fff;
    height: var(--app-height, 100vh);
  }
  #resultCanvas { max-width:92vw; max-height:46vh; background:#111; border-radius:6px; }
  #controls {
    margin-top:10px; width:92vw; max-width:420px;
    display:flex; flex-direction:column; gap:8px;
    max-height:40vh; overflow-y:auto;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #controls .row {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:rgba(255,255,255,0.06); padding:9px 14px; border-radius:10px;
  }
  #controls label { font-size:13px; opacity:0.85; white-space:nowrap; }
  #controls input[type="range"] { flex:1; margin:0 10px; }
  #colorSwatches { display:flex; gap:8px; }
  .swatch { width:26px; height:26px; border-radius:50%; border:3px solid transparent; touch-action:manipulation; }
  .swatch.active { border-color:#0a84ff; }
  .toggle-row input[type="checkbox"] { width:22px; height:22px; }
  #removeBgBtn {
    padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600;
    background:#ff9500; color:#fff; touch-action:manipulation;
  }
  #removeBgBtn:disabled { opacity:0.6; }
  #buttonRow { display:flex; gap:12px; margin-top:4px; }
  #buttonRow button { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:600; touch-action:manipulation; }
  #retakeBtn { background:#555; color:#fff; }
  #saveBtn { background:#0fa968; color:#fff; }
</style>
</head>
<body>

<div id="errorBox"></div>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" class="live"></canvas>

  <div id="topBar">
    <span id="tiltDisplay">傾き:--</span>
    <div id="topBarButtons">
      <button id="calibrateBtn">傾き基準</button>
      <button id="switchCameraBtn">📷 背面</button>
    </div>
  </div>

  <button id="shutter"></button>
</div>

<div id="resultScreen">
  <canvas id="resultCanvas"></canvas>
  <div id="controls">
    <button id="removeBgBtn">背景を削除</button>
    <div class="row">
      <label>格子の間隔</label>
      <input type="range" id="gridSpacing" min="20" max="150" value="50">
      <span id="spacingValue">50px</span>
    </div>
    <div class="row">
      <label>垂直基準線</label>
      <input type="range" id="vLinePos" min="0" max="100" value="50">
    </div>
    <div class="row">
      <label>水平基準線</label>
      <input type="range" id="hLinePos" min="0" max="100" value="50">
    </div>
    <div class="row">
      <label>線の色</label>
      <div id="colorSwatches">
        <div class="swatch active" data-color="#ffffff" style="background:#ffffff;"></div>
        <div class="swatch" data-color="#ff3b30" style="background:#ff3b30;"></div>
        <div class="swatch" data-color="#ffcc00" style="background:#ffcc00;"></div>
        <div class="swatch" data-color="#0a84ff" style="background:#0a84ff;"></div>
      </div>
    </div>
    <div class="row toggle-row">
      <label>姿勢解析点を表示</label>
      <input type="checkbox" id="showPoseToggle" checked>
    </div>
    <div class="row toggle-row">
      <label>グリッドを前面に表示</label>
      <input type="checkbox" id="gridFrontToggle">
    </div>
    <div class="row toggle-row">
      <label>傾き補正を反転</label>
      <input type="checkbox" id="invertTiltToggle">
    </div>
    <div id="buttonRow">
      <button id="retakeBtn">再撮影</button>
      <button id="saveBtn">画像を保存</button>
    </div>
  </div>
</div>

<script>
  function showError(msg) {
    var box = document.getElementById("errorBox");
    box.style.display = "block";
    box.textContent = "エラー: " + msg;
  }
  window.addEventListener("error", function(e) { showError(e.message); });
  window.addEventListener("unhandledrejection", function(e) {
    showError(e.reason ? (e.reason.message || e.reason) : e.reason);
  });
</script>

<script type="module">
import { PoseLandmarker, ImageSegmenter, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9";

function setAppHeight() {
  document.documentElement.style.setProperty("--app-height", window.innerHeight + "px");
}
setAppHeight();
window.addEventListener("resize", setAppHeight);
window.addEventListener("orientationchange", function() { setTimeout(setAppHeight, 200); });

function showError(msg) {
  var box = document.getElementById("errorBox");
  box.style.display = "block";
  box.textContent = "エラー: " + msg;
}

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const tiltDisplay = document.getElementById("tiltDisplay");
const calibrateBtn = document.getElementById("calibrateBtn");
const switchCameraBtn = document.getElementById("switchCameraBtn");
const resultScreen = document.getElementById("resultScreen");
const resultCanvas = document.getElementById("resultCanvas");
const resultCtx = resultCanvas.getContext("2d");
const removeBgBtn = document.getElementById("removeBgBtn");
const gridSpacingInput = document.getElementById("gridSpacing");
const spacingValue = document.getElementById("spacingValue");
const vLinePosInput = document.getElementById("vLinePos");
const hLinePosInput = document.getElementById("hLinePos");
const showPoseToggle = document.getElementById("showPoseToggle");
const gridFrontToggle = document.getElementById("gridFrontToggle");
const invertTiltToggle = document.getElementById("invertTiltToggle");
const retakeBtn = document.getElementById("retakeBtn");
const saveBtn = document.getElementById("saveBtn");
const swatches = document.querySelectorAll(".swatch");

let poseLandmarker = null;
let imageSegmenter = null;
let running = true;
