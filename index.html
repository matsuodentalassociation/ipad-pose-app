<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>姿勢解析(iPad)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#000; overflow:hidden; font-family: sans-serif; }
  #container { position:relative; width:100vw; height:100vh; }
  video, canvas.overlay {
    position:absolute; top:0; left:0;
    width:100%; height:100%; object-fit:cover;
  }
  #topBar {
    position:fixed; top:0; left:0; width:100%;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px;
    background:rgba(0,0,0,0.5);
    color:#fff; font-size:16px;
    z-index:20;
  }
  #tiltDisplay { font-weight:bold; }
  #cameraSwitch, #gridToggle {
    background:rgba(255,255,255,0.2);
    border:1px solid #fff;
    color:#fff;
    padding:6px 12px;
    border-radius:8px;
    font-size:14px;
    margin-left:8px;
  }
  #shutter {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    width:70px; height:70px; border-radius:50%;
    background:#fff; border:4px solid #ccc; z-index:20;
  }
  #gridOverlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    z-index:15; pointer-events:none; display:none;
  }
  #gridOverlay.show { display:block; }
  #gridOverlay .line { position:absolute; background:rgba(255,255,255,0.5); }
  #gridOverlay .v1 { left:33.333%; top:0; width:1px; height:100%; }
  #gridOverlay .v2 { left:66.666%; top:0; width:1px; height:100%; }
  #gridOverlay .h1 { top:33.333%; left:0; width:100%; height:1px; }
  #gridOverlay .h2 { top:66.666%; left:0; width:100%; height:1px; }
  #startOverlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#000; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; z-index:9999;
  }
</style>
</head>
<body>

<div id="startOverlay">タップして開始</div>

<div id="topBar">
  <div id="tiltDisplay">傾き: --</div>
  <div>
    <button id="gridToggle">グリッド</button>
    <button id="cameraSwitch">📷 背面</button>
  </div>
</div>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay" class="overlay"></canvas>
  <div id="gridOverlay">
    <div class="line v1"></div>
    <div class="line v2"></div>
    <div class="line h1"></div>
    <div class="line h2"></div>
  </div>
  <button id="shutter"></button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const tiltDisplay = document.getElementById("tiltDisplay");
const cameraSwitchBtn = document.getElementById("cameraSwitch");
const gridToggleBtn = document.getElementById("gridToggle");
const gridOverlay = document.getElementById("gridOverlay");
const shutterBtn = document.getElementById("shutter");
const startOverlay = document.getElementById("startOverlay");

let poseLandmarker;
let running = true;
let currentFacing = "environment";
let currentStream = null;

async function setupCamera(facingMode) {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode, width: 1280, height: 720 },
    audio: false
  });
  currentStream = stream;
  video.srcObject = stream;
  return new Promise((resolve) => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
}

function drawLoop() {
  if (!running) return;
  const nowInMs = performance.now();
  const result = poseLandmarker.detectForVideo(video, nowInMs);

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const drawingUtils = new DrawingUtils(ctx);
  if (result.landmarks && result.landmarks.length > 0) {
    for (const landmark of result.landmarks) {
      drawingUtils.drawLandmarks(landmark, { radius: 4, color: "#00FF00" });
      drawingUtils.drawConnectors(landmark, PoseLandmarker.POSE_CONNECTIONS, { color: "#00FFFF", lineWidth: 2 });
    }
  }
  ctx.restore();
  requestAnimationFrame(drawLoop);
}

window.addEventListener("deviceorientation", (event) => {
  if (event.beta !== null) {
    tiltDisplay.textContent = `傾き: ${Math.round(event.beta)}°`;
  }
});

cameraSwitchBtn.addEventListener("click", async () => {
  currentFacing = currentFacing === "environment" ? "user" : "environment";
  cameraSwitchBtn.textContent = currentFacing === "environment" ? "📷 背面" : "📷 前面";
  await setupCamera(currentFacing);
});

gridToggleBtn.addEventListener("click", () => {
  gridOverlay.classList.toggle("show");
});

shutterBtn.addEventListener("click", () => {
  const captureCanvas = document.createElement("canvas");
  captureCanvas.width = canvas.width;
  captureCanvas.height = canvas.height;
  const captureCtx = captureCanvas.getContext("2d");
  captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
  captureCtx.drawImage(canvas, 0, 0, captureCanvas.width, captureCanvas.height);
  const link = document.createElement("a");
  link.download = `pose_${Date.now()}.png`;
  link.href = captureCanvas.toDataURL("image/png");
  link.click();
});

startOverlay.addEventListener("click", async () => {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  }
  startOverlay.style.display = "none";
  await setupCamera(currentFacing);
  await setupPose();
  drawLoop();
});
</script>
</body>
</html>
