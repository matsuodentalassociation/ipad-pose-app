<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>姿勢解析(iPad)</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  #container { position:relative; width:100vw; height:100vh; }
  video, canvas {
    position:absolute; top:0; left:0;
    width:100%; height:100%; object-fit:cover;
  }
  #shutter {
    position:absolute; bottom:30px; left:50%; transform:translateX(-50%);
    width:70px; height:70px; border-radius:50%;
    background:#fff; border:4px solid #ccc; z-index:10;
  }
</style>
</head>
<body>
<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <button id="shutter"></button>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

let poseLandmarker;
let running = true;

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: 1280, height: 720 },
    audio: false
  });
  video.srcObject = stream;
  return new Promise((resolve) => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      resolve();
    };
  });
}

async function setupPose() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });
}

function drawLoop() {
  if (!running) return;

  const nowInMs = performance.now();
  const result = poseLandmarker.detectForVideo(video, nowInMs);

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const drawingUtils = new DrawingUtils(ctx);
  if (result.landmarks && result.landmarks.length > 0) {
    for (const landmark of result.landmarks) {
      drawingUtils.drawLandmarks(landmark, { radius: 4, color: "#00FF00" });
      drawingUtils.drawConnectors(landmark, PoseLandmarker.POSE_CONNECTIONS, { color: "#00FFFF", lineWidth: 2 });
    }
  }
  ctx.restore();

  requestAnimationFrame(drawLoop);
}

// シャッターボタン:今表示されている骨格を「確定」として保持する場合の入口
document.getElementById("shutter").addEventListener("click", () => {
  // ここで静止画としてキャプチャする処理を後で追加します
  console.log("撮影ボタンが押されました");
});

(async () => {
  await setupCamera();
  await setupPose();
  drawLoop();
})();
</script>
</body>
</html>
